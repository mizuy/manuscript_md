# Snippet: merge into a research repository Taskfile.yml when you want local
# wrapper tasks. The implementation remains in /Users/mizuy/lab/paper.

vars:
  PAPER_PROJECT: '{{.PAPER_PROJECT | default "../paper"}}'
  PAPER_DIR: '{{.PAPER_DIR | default "paper"}}'
  PAPERPILE_BIB: '{{.PAPERPILE_BIB | default "../vault/paperpile.bib"}}'

tasks:
  paper:docx:
    desc: Delegate Markdown-to-Word build to lab/paper
    vars:
      FILES: '{{.FILES | default "manuscript supplementary"}}'
      PAPER_CSL: '{{.PAPER_CSL | default "vancouver.csl"}}'
      PAPER_PANDOC_FROM: '{{.PAPER_PANDOC_FROM | default "markdown+lists_without_preceding_blankline+fenced_divs"}}'
      PAPER_REFERENCE_DOC: '{{.PAPER_REFERENCE_DOC | default "reference.docx"}}'
      PANDOC: '{{.PANDOC | default "pandoc"}}'
      PANDOC_FLAGS: '{{.PANDOC_FLAGS | default ""}}'
    cmds:
      - >-
        task --taskfile "{{.PAPER_PROJECT}}/Taskfile.yml" --dir "{{.PAPER_PROJECT}}"
        paper:docx
        PAPER_DIR="$(pwd)/{{.PAPER_DIR}}"
        PAPERPILE_BIB="{{.PAPERPILE_BIB}}"
        PAPER_CSL="{{.PAPER_CSL}}"
        PAPER_PANDOC_FROM="{{.PAPER_PANDOC_FROM}}"
        PAPER_REFERENCE_DOC="{{.PAPER_REFERENCE_DOC}}"
        PANDOC="{{.PANDOC}}"
        PANDOC_FLAGS="{{.PANDOC_FLAGS}}"
        FILES="{{.FILES}}"

  paper:words:
    desc: Delegate manuscript word count to lab/paper
    cmds:
      - >-
        task --taskfile "{{.PAPER_PROJECT}}/Taskfile.yml" --dir "{{.PAPER_PROJECT}}"
        paper:words
        PAPER_DIR="$(pwd)/{{.PAPER_DIR}}"
        {{.CLI_ARGS}}
