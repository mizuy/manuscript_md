[project]
name = "manuscript-md"
version = "0.1.0"
description = "Shared Markdown-to-Word paper build tooling for manuscript_md"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
translate = ["deep-translator>=1.11"]

[project.scripts]
manuscript-md = "manuscript_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
