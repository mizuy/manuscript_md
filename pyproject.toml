[project]
name = "lab-paper"
version = "0.1.0"
description = "Shared Markdown-to-Word paper build tooling for lab projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
translate = ["deep-translator>=1.11"]

[project.scripts]
lab-paper = "lab_paper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
